services:
  nginx:
    hostname: nginx
    image: nginx:1-alpine
    ports:
      - '8080:80'
    volumes:
      # Shared /var/www/html between omeka-s and nginx
      - www_dir:/var/www/html
      - ./files/nginx/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      omeka-s:
        condition: service_healthy
        restart: true
  omeka-s:
    hostname: omeka-s
    image: ghcr.io/sepastian/omeka-s-docker:latest
    build: .
    volumes:
      # Shared /var/www/html between omeka-s and nginx
      - www_dir:/var/www/html
    environment:
      - OMEKA_DB_CONNECTION_URL
    depends_on:
      mariadb:
        condition: service_started # use service_healthy after fixing healthcheck for Mariadb
        restart: true
    healthcheck:
      test: ["CMD","netstat","-ln","|","grep","'9000.*LISTEN'"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  mariadb:
    hostname: mariadb
    image: mariadb:lts
    environment:
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_HOST
      - MARIADB_ROOT_PASSWORD
      - MARIADB_PASSWORD
    volumes:
      - mariadb_dir:/var/lib/mysql
    # healthcheck:
    #   test: ["CMD", "healthcheck.sh", "--innodb_initialized"]
    #   start_period: 10s
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
volumes:
  www_dir:
  mariadb_dir:
